      - company: Rhetoricon Database Project (University of Waterloo)
        position: Research Assistant
        location: Waterloo, ON
        start_date: May 2021
        end_date: Dec. 2022
        highlights:
          - Performed a corpus study of the 'A B before B A' construction and collaborated on a research paper, placing the construction at the intersection of rhetoric and construction grammar (received the RhetCanada Undergraduate Student Paper Award in 2022)
          - Researched rhetorical figures and their synonyms and collaborated on the documentation
          - Identified the neurocognitive affinities associated with select rhetorical figures

      - company: Miovision
        position: Data Science Intern
        location: Kitchener, ON
        start_date: Jan. 2022
        end_date: Apr. 2022
        highlights:
          - Identified traffic clusters using unsupervised machine learning (DBSCAN) and plotted them using kepler.gl
          - Created virtual vehicle detectors using Google Earth and geopandas; plotted estimated detector durations; and identified arrivals on green and split failures for 12 intersections in 3 regions, colour-coding the trajectory plots accordingly, using connected car data
          - Created views, looks, and dashboards in Looker to visualize user commitment and feature engagement for four Miovision platforms
          - Identified and visualized discrepancies between data loaded into Snowflake through two different pipelines

      - company: Northbridge
        position: Data Science Intern
        location: Toronto, ON
        start_date: Jan. 2021
        end_date: Apr. 2021
        highlights:
          - Performed exploratory data analysis and built pipelines to clean and preprocess data using custom transformers
          - Developed an ML model that predicts the probability of an insurance policy submission being bound with an AUC of 0.82 using boosting algorithms and interpreted the model using SHAP values 
          - Built a Keras Functional model that takes both text and non-text columns as input to classify policy submissions
          - Reduced the RMSE of a gamma GLM that predicts the severity of an insurance claim by 63% by fine-tuning Google’s Universal Sentence Encoder with loss data using TensorFlow and fitting the GLM using policy description encodings that were created by the fine-tuned model and reduced from 512 to 50 dimensions using PCA                                               

      - company: JANA Corporation
        position: Data Analyst Intern
        location: Aurora, ON
        start_date: Jan. 2020
        end_date: Aug. 2020
        highlights:
          - Implemented Python algorithms for data cleaning and data profiling, including a spell-checker that increases the accuracy of data produced by Google Cloud Vision by 14% and a function that removes EXEC statements from DDLs using regular expressions
          - Extracted crossing and land use data for gas pipelines using SQL and visualized the data using Power BI and QGIS
          - Implemented ETLs (Type 2 SCDs) in SQL
          - Created logical and relational data models and DDLs using Oracle SQL Developer



